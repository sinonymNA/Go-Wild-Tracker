<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <title>{% block title %}GoWild Radar{% endblock %}</title>

  <!-- TailwindCSS CDN -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            radar: { DEFAULT: '#22c55e', dim: '#166534', glow: '#4ade80' }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- App styles -->
  <link rel="stylesheet" href="/static/app.css" />

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased">

  <!-- MOCK MODE banner -->
  {% if mock_mode %}
  <div class="bg-yellow-900/80 border-b border-yellow-700 text-yellow-300 text-xs text-center py-1.5 px-4 sticky top-0 z-50 font-medium tracking-wide">
    ⚠ MOCK MODE — No real flights are being tracked. All data is simulated.
  </div>
  {% endif %}

  <!-- Toast notification -->
  <div id="toast" class="fixed top-4 right-4 z-[100] hidden">
    <div class="bg-gray-800 border border-green-500/40 text-green-300 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2">
      <span class="text-green-400">✓</span>
      <span id="toast-msg">Done</span>
    </div>
  </div>

  <!-- Main content area — bottom padding accounts for nav bar -->
  <main class="pb-20">
    {% block content %}{% endblock %}
  </main>

  <!-- Sticky bottom navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-gray-900 border-t border-gray-800 bottom-nav">
    <div class="flex items-stretch justify-around h-16 max-w-screen-lg mx-auto">

      <a href="/"
         class="nav-item flex flex-col items-center justify-center flex-1 gap-0.5 text-xs font-medium transition-colors
                {% if request.url.path == '/' %}text-green-400 border-t-2 border-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Dashboard
      </a>

      <a href="/routes"
         class="nav-item flex flex-col items-center justify-center flex-1 gap-0.5 text-xs font-medium transition-colors
                {% if request.url.path == '/routes' %}text-green-400 border-t-2 border-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        Routes
      </a>

      <button id="scan-btn"
              class="nav-item flex flex-col items-center justify-center flex-1 gap-0.5 text-xs font-medium text-gray-500 hover:text-green-400 transition-colors active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        Scan
      </button>

      <a href="/settings"
         class="nav-item flex flex-col items-center justify-center flex-1 gap-0.5 text-xs font-medium transition-colors
                {% if request.url.path == '/settings' %}text-green-400 border-t-2 border-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
      </a>

      <a href="/logs"
         class="nav-item flex flex-col items-center justify-center flex-1 gap-0.5 text-xs font-medium transition-colors
                {% if request.url.path == '/logs' %}text-green-400 border-t-2 border-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        Logs
      </a>

    </div>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLcE=" crossorigin=""></script>

  <script>
    // Toast helper
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      const m = document.getElementById('toast-msg');
      m.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    // Scan button
    document.getElementById('scan-btn').addEventListener('click', async () => {
      const btn = document.getElementById('scan-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/scan/run', { method: 'POST' });
        if (res.ok) {
          showToast('Scan triggered! Results will appear shortly.');
        } else {
          showToast('Failed to trigger scan.', 'error');
        }
      } catch (e) {
        showToast('Network error.', 'error');
      } finally {
        setTimeout(() => { btn.disabled = false; }, 3000);
      }
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
